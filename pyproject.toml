[project]
name = "oracle-mcp-server"
version = "0.1.5"
description = "MCP server for Oracle database schema context retrieval"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28.1,<2",
    "oracledb>=2.0.0",
    "python-dotenv>=1.0.0",
    "sqlparse>=0.6.0",
]

[project.scripts]
oracle-mcp-server = "main:main"

[project.optional-dependencies]
dev = [
    "black",
    "mypy",
    "ruff",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0"
]

[tool.ruff]
select = ["E", "F", "I"]
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true

[tool.setuptools.packages.find]
where = ["."]
include = ["db_context*"]
[tool.setuptools]
py-modules = ["main"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
